[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecobee"
version = "2.0.0"
description = "A Python implementation of the ecobee API"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sherif Fanous", email = "pyecobee_support@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["requests>=2.13.0"]

[project.urls]
Homepage = "https://github.com/sfanous/Pyecobee"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
exclude = ["build", "dist", ".venv", "plantuml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Ruff's formatter is the line-length authority.

[tool.ruff.lint.per-file-ignores]
"pyecobee/__init__.py" = ["F401"]  # Public API re-exports.
"pyecobee/service.py" = ["B008"]  # Preserve established request defaults.
"pyecobee/utilities.py" = ["B006", "B904", "B905", "F401", "UP030"]  # Reflective registry and established utility behavior.
"tests/live_integration.py" = ["B006", "F403", "F405", "F841"]  # Legacy live-test harness.
"tests/test_responses.py" = ["B017"]  # Existing broad exception regression assertion.

[tool.setuptools.packages.find]
include = ["pyecobee*"]
