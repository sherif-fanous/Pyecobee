[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecobee"
version = "2.0.0"
description = "A Python implementation of the ecobee API"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sherif Fanous", email = "pyecobee_support@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "pydantic>=2.12,<3",
    "requests>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/sfanous/Pyecobee"

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
exclude = ["build", "dist", ".venv", "plantuml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Ruff's formatter is the line-length authority.

[tool.ruff.lint.per-file-ignores]
"pyecobee/service.py" = ["B008"]  # Preserve established request defaults.
"pyecobee/services/thermostats.py" = ["B008"]  # Preserve facade-compatible request defaults.

[tool.setuptools.packages.find]
include = ["pyecobee*"]
