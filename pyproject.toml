[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecobee"
version = "2.0.0"
description = "A Python implementation of the ecobee API"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sherif Fanous", email = "pyecobee_support@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "pydantic>=2.12,<3",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/sherif-fanous/Pyecobee"
Changelog = "https://github.com/sherif-fanous/Pyecobee/blob/master/CHANGELOG.md"
Issues = "https://github.com/sherif-fanous/Pyecobee/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Blank-line padding between statements is not expressible in Ruff
# (astral-sh/ruff#8724), so tools/blank_lines.py covers it.
# D202/D204 own the blank lines around docstrings.
select = [
    "E", "F", "I", "N", "UP", "B", "D202", "D204",
    "A",     # Shadowed builtins.
    "ANN",   # Complete function annotations.
    "C4",    # Comprehension and literal construction.
    "DTZ",   # Naive datetimes, which this API cannot represent.
    "G",     # Logging call correctness.
    "LOG",   # Logging module misuse.
    "PERF",  # Avoidable loop overhead.
    "PIE",
    "PT",    # pytest style.
    "PTH",   # pathlib over os.path.
    "RET",   # Redundant branching around return.
    "RUF",   # Includes sorted __all__ and __slots__.
    "S",     # Credential and subprocess hazards. Tests are exempt below.
    "SIM",
    "TC",    # Imports needed only for type checking.
]
ignore = [
    "E501",  # Ruff's formatter is the line-length authority.
    "N812",  # The DateTime alias is part of the documented public surface.
    "N818",  # Renaming EcobeeException and friends would break callers.
    "ANN401", # Any remains appropriate at dynamic JSON/HTTP boundaries.
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these annotations at runtime, so the imports must stay
# at module scope even though they only ever appear in annotations.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pyecobee.ecobee_object.EcobeeObject",
    "pyecobee.ecobee_object.EcobeeResponseObject",
]

[tool.ruff.lint.per-file-ignores]
"pyecobee/service.py" = ["B008"]  # Preserve established request defaults.
"pyecobee/services/thermostats.py" = ["B008"]  # Preserve facade-compatible request defaults.
"tests/*" = ["ANN", "S"]  # Tests favor concise local helpers and bare asserts.

[tool.setuptools.packages.find]
include = ["pyecobee*"]

[tool.setuptools.package-data]
pyecobee = ["py.typed"]
